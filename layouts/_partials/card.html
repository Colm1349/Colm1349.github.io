<a class="card" href="{{ .RelPermalink }}"
   data-search="{{ lower (printf "%s %s %s" .Title .Description (delimit (.Params.tags | default slice) " ")) }}">
  <div class="card-cover">
    {{ with .Params.image }}<img src="{{ . | relURL }}" alt="" loading="lazy">{{ else }}<span>{{ .Params.emoji | default "🍽️" }}</span>{{ end }}
  </div>
  <div class="card-body">
    <h3>{{ .Title }}</h3>
    <p>{{ .Description }}</p>
    <div class="meta">
      {{ with .Params.time }}<span>⏱ {{ . }}</span>{{ end }}
      {{ with .Params.servings }}<span>🍽 {{ . }} порц.</span>{{ end }}
    </div>
  </div>
</a>
