{{ define "main" }}
<h1 class="page-title">{{ if eq .Data.Plural "tags" }}Теги{{ else }}Категории{{ end }}</h1>
<div class="chips big">
  {{ range .Data.Terms.Alphabetical }}
    <a class="chip" href="{{ .Page.RelPermalink }}">{{ .Page.Title }} <small>{{ .Count }}</small></a>
  {{ end }}
</div>
{{ end }}
